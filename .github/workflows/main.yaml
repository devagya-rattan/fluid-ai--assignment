name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build  -t fluid-ai-backend:v1 .

      - name: Tag Docker image
        run: |
          docker tag fluid-ai-backend:v1 \
            ${{ secrets.DOCKERHUB_USERNAME }}/fluid-ai-backend:v1

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/fluid-ai-backend:v1

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.AWS_VM_HOST }}
          username: ${{ secrets.AWS_VM_USER }}
          key: ${{ secrets.AWS_VM_SSH_KEY }}

          script: |
            cd ~/home/ubuntu/fluid-ai-demo/k8s

            sudo k3s kubectl apply -f namespace.yaml

            sudo k3s kubectl apply -f deployment.yaml

            sudo k3s kubectl apply -f service.yaml

            sudo k3s kubectl rollout restart deployment/backend -n devops-demo

            sudo k3s kubectl rollout status deployment/backend -n devops-demo